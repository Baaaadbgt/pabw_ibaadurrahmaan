<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            My assignment and their deadlines
        </title>
    </head>
    <body>
        <header>
            <h1>My assignment and their deadlines</h1>
                <nav aria-label="Main navigation">
                    <ul>
                        <li><a href="#bagian-1">Link 1</a></li>
                        <li><a href="#bagian-2">Link 2</a></li>
                        <li><a href="#bagian-3">Link 3</a></li>
                    </ul>
                </nav>
        </header>
    
    <main>
        <section id="bagian-1">
            <h2>List of Assignments</h2>
            <table border="1">
                <caption>My assignment and their deadlines</caption>
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Assignment</th>
                        <th>Deadline</th>
                        <th>Image</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Assignment 1</td>
                        <td>2023-10-15</td>
                        <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRcxs5GebropMjgscSjeiF9pfeJXt3SvtYeG3MIFpjfdA&s=10" alt="Assignment 1" width="100" height="100"></td>
                    </tr>
                    <tr>
                        <td>2</td> 
                        <td>Assignment 2</td>
                        <td>2023-10-22</td>
                        <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRcxs5GebropMjgscSjeiF9pfeJXt3SvtYeG3MIFpjfdA&s=10" alt="Assignment 2" width="100" height="100"></td>
                    </tr>
                </tbody>
            </table>
        </section>
    
        <section id="bagian-2">
        <h2>Add Assignment</h2>
            <form action="/simpan" method="post">

                <p>
                    <label for="assignment-name">Assignment Name</label>
                    <input 
                        type="text" 
                        id="assignment-name" 
                        name="assignment-name" 
                        required
                    >
                </p>
                <p>
                    <label for="deadline">Deadline</label>
                    <input 
                        type="date" 
                        id="deadline" 
                        name="deadline" 
                        required
                    >
                </p>
                <p>
                    <label for="image">Image URL</label>
                    <input 
                        type="url" 
                        id="image" 
                        name="image" 
                        required
                    >
                </p>
                <button type="submit">Save Assignment</button>
            </form>
        </section>
    </main>
    
    <footer>
        <p>Muhammad 'Ibaadurrahmaan · 25523213 · 2026</p>
    </footer>
    </body>

</html>
