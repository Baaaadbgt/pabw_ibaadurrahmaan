<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>01 - Vue Hello (CDN)</title>
  <!--
    EXAMPLE 01: your first Vue 3 page, no installation needed.
    What it shows : the Vue app object, ref(), {{ }} interpolation, @click.
    How to run    : double-click this file, or right-click > "Open with Live Server" in VS Code.
                    (An internet connection is needed once, to load Vue from the CDN.)
    Slide topic   : "Why a framework?" and "Template syntax: {{ }} and @click".
  -->
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; color: #1e293b; }
    button { font: inherit; padding: .4rem .9rem; margin-right: .5rem; cursor: pointer; }
    .count { font-size: 2rem; font-weight: 700; color: #1d3a8c; }
  </style>
</head>
<body>
  <!-- Vue takes control of everything inside #app -->
  <div id="app">
    <h1>{{ title }}</h1>
    <p>Hello, <strong>{{ name }}</strong>!</p>
    <p>You clicked <span class="count">{{ count }}</span> times.</p>
    <button @click="count++">+1</button>
    <button @click="reset">Reset</button>
  </div>

  <!-- Vue 3 from a CDN, pinned to an exact version so the page never changes by itself -->
  <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        // ref() makes a value "reactive": when it changes, the page updates by itself.
        const title = ref('My first Vue page');
        const name = ref('Web Development student');
        const count = ref(0);

        function reset() { count.value = 0; }   // in script you use .value; in the template you do not

        return { title, name, count, reset };
      }
    }).mount('#app');
  </script>
</body>
</html>
